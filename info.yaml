# Tiny Tapeout project information
project:
  title:        "LFSR Stream Cipher"      # Project title
  author:       "Rohcell King Sisit"      # Your name
  discord:      "minjun0311"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A 4-bit LFSR-based hardware stream cipher."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_lfsr_cipher"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "data_in_0"
  ui[1]: "data_in_1"
  ui[2]: "data_in_2"
  ui[3]: "data_in_3"
  ui[4]: "key_in_0"
  ui[5]: "key_in_1"
  ui[6]: "key_in_2"
  ui[7]: "key_in_3"

  # Outputs
  uo[0]: "cipher_out_0"
  uo[1]: "cipher_out_1"
  uo[2]: "cipher_out_2"
  uo[3]: "cipher_out_3"
  uo[4]: "lfsr_state_0"
  uo[5]: "lfsr_state_1"
  uo[6]: "lfsr_state_2"
  uo[7]: "lfsr_state_3"

  # Bidirectional pins
  uio[0]: "unused"
  uio[1]: "unused"
  uio[2]: "unused"
  uio[3]: "unused"
  uio[4]: "unused"
  uio[5]: "unused"
  uio[6]: "unused"
  uio[7]: "unused"

# Do not change!
yaml_version: 6
